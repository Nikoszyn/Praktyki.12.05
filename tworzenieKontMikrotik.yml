---
- name: Konfiguracja uzytkownikow i kluczy SSH na MikroTik
  gather_facts: false
  hosts: all
  # Do dedykowanych modułów używamy standardowego połączenia ansible.netcommon.network_cli
  connection: network_cli

  vars:
    # Sam klucz publiczny (bez typu i komentarza na początku/końcu)
    ssh_key_clean: "AAAAC3NzaC1lZDI1NTE5AAAAIBXJgJRptFTu+uux3fdl4IlYye/6zHUYUM1gx+ekjxR7"

  tasks:
    - name: Bezpieczne dodanie uzytkownikow (tylko jesli nie istnieja)
      community.routeros.user:
        name: "{{ item.name }}"
        group: "{{ item.group }}"
        comment: "{{ item.comment }}"
        state: present
      loop:
        - { name: "user_full", group: "full", comment: "Konto FULL" }
        - { name: "user_write", group: "write", comment: "Konto WRITE" }
        - { name: "user_read", group: "read", comment: "Konto READ" }

    - name: Przypisanie klucza SSH do uzytkownikow
      community.routeros.user_ssh_key:
        user: "{{ item }}"
        key: "{{ ssh_key_clean }}"
        key_type: "ed25519"
        state: present
      loop:
        - "user_full"
        - "user_write"
        - "user_read"
