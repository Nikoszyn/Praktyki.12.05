---
- name: Tworzenie uzytkownika i import klucza SSH na MikroTik
  hosts: all
  gather_facts: false

  vars:
    user_group: "full"

  tasks:
    # Zastąpiony moduł .user zwykłą komendą CLI
    - name: Stwórz nowego użytkownika w RouterOS
      community.routeros.command:
        commands:
          - "/user add name={{ new_user_name }} group={{ user_group }}"
      register: user_creation
      failed_when: 
        - user_creation.failed 
        - "'already has user' not in user_creation.stdout[0]" 
        # Ignorujemy błąd, jeśli użytkownik już istnieje

    - name: Zainicjalizuj plik na MikroTiku
      community.routeros.command:
        commands:
          - "/file print file=temp_key.txt"

    - name: Odczekaj chwilę na utworzenie pliku
      ansible.builtin.pause:
        seconds: 1

    - name: Wpisz klucz SSH do pliku
      community.routeros.command:
        commands:
          - "/file set temp_key.txt contents=\"{{ public_key_text }}\""

    - name: Import klucza SSH z utworzonego pliku
      community.routeros.command:
        commands:
          - "/user ssh-keys import public-key-file=temp_key.txt user={{ new_user_name }}"

    - name: Usuń plik tymczasowy
      community.routeros.command:
        commands:
          - "/file remove temp_key.txt"
